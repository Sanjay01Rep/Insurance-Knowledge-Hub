[server]
headless = true
port = 8501
address = "localhost"
maxUploadSize = 25
# Do not watch files. Poll + runOnSave walks Hugging Face/transformers on
# every save and on Ctrl+C, which freezes the window ("stopping").
# After a code change, close the window and double-click run.bat again.
fileWatcherType = "none"
runOnSave = false
folderWatchBlacklist = [".venv", "__pycache__", ".git"]

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#005696"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a2332"
font = "sans serif"
base = "light"
